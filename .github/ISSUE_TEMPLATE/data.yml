name: 🗂 Data / Prompts / Fixtures
description: Track shared prompts, tasks, corpora, fixtures, and dataset preparation
title: '🗂 '
body:
  - type: textarea
    id: proposal
    attributes:
      label: Summary / Context / Details
      description: Describe the data artifact, provenance, format, and why it is needed.
      value: |
        Summary:

        Context / Motivation:

        Details:
        - Data type:
        - Source / generation method:
        - Expected schema / format:
        - Experiments using it:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define validation, documentation, and reproducibility requirements.
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Resources
      description: Add source datasets, licenses, papers, or benchmark links.
    validations:
      required: false
