experiment:
  id: exp_002
  name: quantization_using_approach_a
  seed: 42

model:
  model: Qwen/Qwen3.8-27B

quantization:
  approach: approach_a
  variants: [q8, q6, q5, q4]

metrics:
  - task_accuracy
  - peak_memory
  - time_to_first_token
  - prefill_tokens_per_second
  - decode_tokens_per_second

sampling:
  temperature: 0.0

output:
  directory: results
