[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-lab"
version = "0.1.0"
description = "Reusable infrastructure for local LLM research experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
transformers = [
    "transformers>=4.51.0",
    "torch>=2.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lab"]
